[package]
name = "anypartmade-fixit"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
description = "Any Part Made Studio: Meta SAM 3.1 measures from a photo, Muse Spark designs the part, Any Part Made verifies it."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
futures = "0.3"
jpeg-decoder = { version = "0.3", default-features = false }
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = { version = "0.8", features = ["d1"], optional = true }
getrandom = { version = "0.2", features = ["js"], optional = true }

[features]
# The Worker. The browser mesher (mesher/) uses this crate without it.
default = ["worker"]
worker = ["dep:worker", "dep:getrandom"]

[workspace]
members = [".", "mesher"]

[profile.release]
opt-level = "s"
lto = true
